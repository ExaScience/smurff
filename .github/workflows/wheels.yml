name: Build Wheels

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - v*
  release:

jobs:
  build_wheels:
    name: Build wheel ${{ matrix.pyver }}-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-latest]
        arch: [native, aarch64]
        pyver: [cp39, cp310, cp311, cp312, cp313, cp314]
        include:
          - os: windows-latest
            arch: "native"
          - os: macos-15
            arch: "native"
          - os: macos-15-intel
            arch: "native"
          - os: ubuntu-latest
            arch: "native"
          - os: ubuntu-latest
            arch: "aarch64"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
          fetch-depth: 0

      # Used to host cibuildwheel
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        env:
          CIBW_BUILD: ${{ matrix.pyver }}-*
          CIBW_ARCHS: ${{ matrix.arch }}
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.pyver }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  merge:
    name: merge all wheel artifacts
    runs-on: ubuntu-latest
    needs: build_wheels
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: all-wheels
